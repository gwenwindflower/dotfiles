onboarding = false

[ui]
agent_panel_scope = "all"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "terminal"

[theme]
name = "terminal"

[keys]
prefix = "ctrl+space"
reload_config = "prefix+shift+r"
new_tab = "prefix+c"
rename_tab = "prefix+shift+c"
previous_tab = "ctrl+alt+h"
next_tab = "ctrl+alt+l"
focus_tab_left = "shift+alt+h"
focus_tab_right = "shift+alt+l"
new_workspace = "prefix+n"
rename_workspace = "prefix+shift+n"
previous_workspace = "ctrl+super+k"
next_workspace = "ctrl+super+j"
previous_agent = "ctrl+alt+k"
next_agent = "ctrl+alt+j"

[[keys.command]]
key = "prefix+ctrl+g"
type = "pane"
command = "lazygit"
description = "launch lazygit in a new pane"

[experimental]
kitty_graphics = true
