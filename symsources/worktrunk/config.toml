[commit.generation]
command = "CLAUDE_CODE_DISABLE_THINKING=1 claude -p --model=sonnet --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"
template-append = """
- Conventional commits: `type(scope): subject` in imperative mood, no trailing period, subject ≤72 chars.
- Types: feat, fix, test (tests only), refactor (no behavior change), perf, style (formatting only), build, ci, chore, docs (docs only).
- Pick a specific scope from the diff: `feat(auth): add JWT refresh token rotation`, not `feat: update auth`.
- Skip the body unless state changes aren't obvious from the diff or subject. When used:
  - 3-5 short bullets max, one sentence each, imperative mood, state changes only.
  - Use `*` as the bullet character, not `-`.
  - A one-clause purpose tag is fine; extended rationale, alternatives, or findings belong in DONE/specs, not here.
- Trailers, in this order, separated from body by a blank line:
  - `Closes #N` / `Fixes #N` / `Resolves #N` when the diff, branch name, or recent commits reference a GitHub issue or PR this commit closes — so GitHub auto-closes on merge.
  - `Closes Phase <n>` when the commit closes a SPOT Phase.
  - `Co-Authored-By: Claude Sonnet {current version} <noreply@anthropic.com>` always as the final line (e.g. `Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>`)
"""

[list]
summary = true

# Virtualenvs bake absolute paths into pyvenv.cfg and script shebangs, so they
# break at a new path. Everything else is reflink-cloned and costs no disk.
[step.copy-ignored]
exclude = [".venv/", "venv/"]

[aliases]
switch-shift = '''
fish -c """
if git diff --quiet HEAD and test -z '$(git ls-files --others --exclude-standard)'
    wt switch --create {{ to }} --execute='{{ args }}'
else
    git stash push --include-untracked --quiet
    wt switch --create {{ to }} --execute fish -- -c 'git stash pop --index; {{ args }}'
end
"""
'''

switch-keep = '''
fish -c """
if git diff --quiet HEAD and test -z '$(git ls-files --others --exclude-standard)'
    wt switch --create {{ to }} --execute='{{ args }}'
else
    git stash push --include-untracked --quiet
    wt switch --create {{ to }} --execute fish -- -c 'git stash apply --index --quiet; {{ args }}'
end
"""
'''

# pre-start rather than post-start: --execute agents must land on installed deps.
[[pre-start]]
copy = "wt step copy-ignored"

# A failing pre-start step cancels --execute, so a machine without depop would
# create the worktree but never launch the agent. Degrade to skipping instead.
[[pre-start]]
deps = "command -v depop >/dev/null || { echo 'depop not installed; skipping dependency sync' >&2; exit 0; }; depop"
