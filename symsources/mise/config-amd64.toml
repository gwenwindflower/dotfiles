[tools]
node = ["lts", "latest"]

"npm:@agentclientprotocol/claude-agent-acp" = "latest"
"npm:@agentclientprotocol/codex-acp" = "latest"
"npm:@aredotna/cli" = "latest"
"npm:@readwise/cli" = "latest"
"npm:supabase" = "latest"
"npm:knap" = "latest"
opencode = { version = "latest", allow_builds = ["@opencode/cli"] }

[settings]
npm.package_manager = "pnpm"
idiomatic_version_file_enable_tools = ["node", "ruby"]

minimum_release_age_excludes = ["aube", "node", "sfw"]

[settings.github]
credential_command = "gh auth token"
