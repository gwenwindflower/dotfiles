#:schema https://developers.openai.com/codex/config-schema.json
#:tombi schema.strict = false

model = "gpt-5.6-terra"
personality = "pragmatic"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
# Waiting for the beta Permissions system to be fully baked
# It's been a huge pain in the ass the past week or two
# This is the profile when ready
# leaving the configs for it in place
# as they don't hurt anything if the profile is not active
# default_permissions = "workspace-winnie"
web_search = "cached"
project_doc_max_bytes = 65536
sqlite_home = "~/.codex/sqlite"
model_reasoning_effort = "high"
suppress_unstable_features_warning = true

notify = [
  "/Users/winnie/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient",
  "turn-ended"
]
service_tier = "default"

[sandbox_workspace_write]
network_access = true
writable_roots = [
  # tool state and caches
  "~/.cache",
  "~/.agent-browser",
  "~/.blacksmith",
  "~/.config/.wrangler",
  "~/.context7",
  "~/.critique",
  "~/.duckdb",
  "~/.gitconfig",
  "~/.local/state/herdr",
  "~/.local/share/graveyard",
  "~/Library/Caches/dev.biomejs.biome",
  "~/Library/Caches/kitty",
  # Codex state
  "~/.codex/tmp",
  "~/.codex/.tmp",
  "~/.codex/sqlite",
  "~/.codex/cache",
  "~/.codex/memories",
  "~/.codex/plugins",
  "~/.codex/skills",
  # runtimes and package managers
  "~/Library/Caches/Homebrew",
  "~/.bun/install",
  "~/.deno/bin",
  "~/Library/Caches/deno",
  "~/.local/share/aube",
  "~/.local/share/mise",
  "~/.local/state/mise",
  "~/Library/Caches/mise",
  "~/.npm",
  "~/Library/Caches/node-gyp",
  "~/.local/share/pnpm",
  "~/.go/pkg/mod",
  "~/Library/Caches/go-build",
  "~/.cargo/registry",
  "~/.cargo/git",
  "~/.local/share/uv",
  "~/Library/Caches/pip",
  # selected chezmoi-managed tool sources
  "~/.local/share/chezmoi/symsources/aube",
  "~/.local/share/chezmoi/symsources/mise",
  "~/.local/share/chezmoi/symsources/worktrunk",
]

[tui]
pet = "disabled"
show_tooltips = false
theme = "catppuccin-frappe"
status_line = [
  "model-with-reasoning",
  "project-name",
  "git-branch",
  "branch-changes",
  "five-hour-limit",
  "weekly-limit",
  "task-progress",
  "context-used"
]
status_line_use_colors = true

[tui.keymap.composer]
submit = ["ctrl-return", "alt-return"]
queue = "alt-tab"

[tui.keymap.editor]
insert_newline = ["return"]

[tui.keymap.pager]
jump_top = ["home", "g"]
jump_bottom = ["end", "shift-g"]

[tui.keymap.list]
jump_top = ["home", "g"]
jump_bottom = ["end", "shift-g"]

[tui.model_availability_nux]
"gpt-5.5" = 4

[features]
hooks = true
multi_agent = true
terminal_resize_reflow = true
external_migration = true
prevent_idle_sleep = true
exec_permission_approvals = true
request_permissions_tool = true
js_repl = false
apps = true

[permissions.workspace-winnie]
extends = ":workspace"

[permissions.workspace-winnie.filesystem]
