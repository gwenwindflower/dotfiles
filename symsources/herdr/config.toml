onboarding = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
prompt_new_tab_name = false

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "$jump", dim = true }, "workspace"],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "$space", { token = "$worktree", dim = true }],
  ["agent"],
]

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[theme]
name = "terminal"

auto_switch = false

[theme.custom]
accent = "#ca9ee6"

[experimental]
kitty_graphics = true

[keys]
prefix = "ctrl+space"
settings = "prefix+."
reload_config = ["prefix+alt+r", "prefix+super+r"]
toggle_sidebar = ["prefix+b", "ctrl+super+["]
goto = "prefix+w"
# focus_pane_* = handled by herdr-splits plugin
close_pane = ["prefix+x", "prefix+d"]
last_pane = ["prefix+`", "alt+shift+p"]
split_vertical = ["prefix+|", "prefix+ctrl+v"]
split_horizontal = ["prefix+-", "prefix+ctrl+s"]
new_tab = ["prefix+c", "ctrl+t"]
rename_tab = "prefix+shift+c"
previous_tab = "shift+super+h"
next_tab = "shift+super+l"
close_tab = ["prefix+shift+x", "prefix+ctrl+d"]
switch_tab = "prefix+ctrl+1..9"
new_workspace = "prefix+n"
rename_workspace = "prefix+shift+n"
previous_workspace = "shift+super+k"
next_workspace = "shift+super+j"
switch_workspace = "prefix+1..9"
close_workspace = ["prefix+alt+d", "prefix+super+d"]
next_agent = "shift+super+n"
previous_agent = "shift+super+p"

# git
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "wtherdr.switch"
description = "wt switch worktree"

[[keys.command]]
key = "prefix+ctrl+g"
type = "plugin_action"
command = "wtherdr.merge"
description = "wt merge worktree"

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "wtherdr.remove"
description = "wt remove worktree"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "wtherdr.create"
description = "wt create worktree"

[[keys.command]]
key = ["prefix+super+g"]
type = "pane"
command = "lazygit"
description = "launch lazygit in a new pane"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "ctrl+left"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "ctrl+down"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "ctrl+up"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "ctrl+right"
type = "plugin_action"
command = "herdr-splits.resize-right"

[[keys.command]]
key = "prefix+alt+c"
type = "plugin_action"
command = "livery.reset"

[[keys.command]]
key = ["prefix+o", "shift+super+o"]
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump with navigator"

[[keys.command]]
key = "prefix+shift+O"
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "navigator side pane"
