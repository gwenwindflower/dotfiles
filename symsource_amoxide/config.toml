[aliases]
aicf = "nvim ~/.local/share/chezmoi/.utils/twinsies.toml"
aicfx = "cd ~/.local/share/chezmoi/.utils && deno task twinsies && cd -"
brsf = "brew search {{1}} | fzf --multi --prompt='Filter results: ' --preview='brew info {1}'"
ccp = "cat {{1}} | fish_clipboard_copy"
ddb = "duckdb --cmd '.read ~/dev/02_spellbook/pastel_duck_theme.sql'"
gri = "git rebase -i --autosquash HEAD~{{1}}"
ltd = "lsd --tree --depth={{1}}"
pport = "lsof -i :{{1}}"
spc = "sprite console -s {{1}}"
spd = "sprite destroy"
spls = "sprite list"
spx = "sprite exec -s {{1}} {{2}}"
ssx = "ssh -A {{1}}.exe.xyz"

[shell.fish]
use_abbr = true

[logging]
project_unloading = "off"

[update]
check = false
