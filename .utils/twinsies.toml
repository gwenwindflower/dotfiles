# twinsies.toml — source of truth for entries synced across agent configs.
#
# Each [<domain>.<channel>] table lists entries that every supporting agent
# should have. Run `deno task twinsies` to add missing entries; `deno task
# check-twinsies` to lint without writing. Additive only — never removes
# entries from target files.
#
# Channels (under [permissions]):
#   bash     — shell command patterns        → Claude `Bash(<p>)`, OpenCode `permission.bash[<p>]`
#   read     — file read patterns            → Claude `Read(<p>)`,  OpenCode `permission.read[<p>]`
#   edit     — file edit patterns            → Claude `Edit(<p>)`,  OpenCode `permission.edit[<p>]`
#   scalars  — single-key capability toggles → Claude bare key,     OpenCode `permission.<key>`
#
# Anything Claude-only (WebFetch domains, MCP server names, Read allowlists)
# stays in symsource_claude/settings.json — twinsies only handles cross-agent
# patterns. Same for OpenCode-only bits (the catch-all `"*" = "ask"`).

# ── Bash ──────────────────────────────────────────────────────────────

[permissions.bash]
# allow
"* --help *" = "allow"
"* --version *" = "allow"
"bat *" = "allow"
"blacksmith *" = "allow"
