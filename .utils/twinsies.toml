# twinsies.toml — source of truth for entries synced across agent configs.
#
# Each [<domain>.<channel>] table lists entries that every supporting agent
# should have. Run `deno task twinsies` to reconcile target files to this
# manifest (full sync — adds missing, removes extras, fixes mode drift inside
# the regions twinsies owns). `deno task twinsies:preview` for a rich diff +
# proposed file contents (exit 0); `deno task twinsies:check` for a terse
# drift report (exit 1 on any drift, for CI / pre-commit).
#
# Channels (under [permissions]):
#   bash  — shell command patterns → Claude `Bash(<p>)`, OpenCode `permission.bash[<p>]`
#   edit  — file edit patterns     → Claude `Edit(<p>)`, OpenCode `permission.edit[<p>]`
#
# Out of scope (hand-maintained per agent — too agent-specific to be worth
# wrangling here):
#   • Read permissions — Claude's sandbox read-root allowlist is a Claude-only
#     feature; OpenCode has no parallel.
#   • Scalar/capability toggles (Claude `Skill`, OpenCode `permission.skill`)
#     — one line per agent.
#   • Claude-only knobs (WebFetch domains, MCP server names) in settings.json.
#   • OpenCode-only knobs (the `"*" = "ask"` catch-all inside `permission.bash`,
#     other top-level config) in opencode.jsonc.
# Twinsies leaves all of these untouched.

