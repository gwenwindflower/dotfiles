#:schema https://yazi-rs.github.io/schemas/keymap.json

[[mgr.prepend_keymap]]
on = ["<C-p>"]
run = "seek -5"
desc = "Seek up 5 units in the preview"

[[mgr.prepend_keymap]]
on = ["<C-n>"]
run = "seek 5"
desc = "Seek down 5 units in the preview"

[[mgr.prepend_keymap]]
on = ["<C-[>"]
run = "back"
desc = "Navigate back in history"

[[mgr.prepend_keymap]]
on = ["<C-]>"]
run = "forward"
desc = "Navigate forward in history"

[[mgr.prepend_keymap]]
on = ["g", "r"]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to current git repository root"

[[mgr.prepend_keymap]]
on = ";"
run = "plugin custom-shell -- auto --interactive"
desc = "Run a command with $SHELL"

[[mgr.prepend_keymap]]
on = ":"
run = "plugin custom-shell -- auto --interactive --block"
desc = "Run a command with $SHELL and wait"

[[mgr.prepend_keymap]]
on = "!"
for = "unix"
run = 'shell "$SHELL" --block'
desc = "Open $SHELL here"

[[mgr.prepend_keymap]]
on = ["'", ";"]
run = "shell --interactive"
desc = "Run a command with sh"

[[mgr.prepend_keymap]]
on = ["'", ":"]
run = "shell --block --interactive"
desc = "Run a command with sh and wait"

[[mgr.prepend_keymap]]
on = ["'", "h"]
run = "plugin custom-shell history"
desc = "Show Custom-shell history"

[[mgr.prepend_keymap]]
desc = "Start bunny.yazi"
on = "@"
run = "plugin bunny"

[[mgr.prepend_keymap]]
desc = "Start bunny.yazi fuzzy search"
on = ["g", "@"]
run = "plugin bunny fuzzy"

[[mgr.prepend_keymap]]
on = "E"
run = "plugin editor -- edit"
desc = "Open hovered item in $EDITOR"

[[mgr.prepend_keymap]]
on = "e"
run = "plugin editor -- git-root"
desc = "Open $EDITOR at git repo root"

[[mgr.prepend_keymap]]
on = "?"
run = "help"
desc = "Open keymaps help"

[[mgr.prepend_keymap]]
on = "<A-p>"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

[[mgr.prepend_keymap]]
on = "<A-P>"
run = "plugin toggle-pane min-preview"
desc = "Show or hide the preview pane"

[[mgr.prepend_keymap]]
on = "f"
run = "plugin searchjump -- autocd"
desc = "Searchjump mode"

[[mgr.prepend_keymap]]
on = "F"
run = "find --smart"
desc = "Find next file"

[[mgr.prepend_keymap]]
on = "z"
run = "plugin zoxide"
desc = "Jump to a directory via zoxide"

[[mgr.prepend_keymap]]
on = "Z"
run = "plugin fzf"
desc = "Jump to a file or directory via fzf"

[[mgr.prepend_keymap]]
on = "\\"
run = "filter --smart"
desc = "Smart filter in cwd"

[[mgr.prepend_keymap]]
on = "H"
run = "plugin duckdb -1"
desc = "Scroll one column to the left"

[[mgr.prepend_keymap]]
on = "L"
run = "plugin duckdb +1"
desc = "Scroll one column to the right"

[[mgr.prepend_keymap]]
on = ["g", "o"]
run = "plugin duckdb -open"
desc = "open with duckdb"

[[mgr.prepend_keymap]]
on = ["g", "u"]
run = "plugin duckdb -ui"
desc = "open with duckdb ui"

[[mgr.prepend_keymap]]
on = "C"
run = "plugin chezmoi"
desc = "chezmoi menu"

[[mgr.prepend_keymap]]
on = ["c", "m"]
run = "plugin chmod"
desc = "chmod on selected files"

[[mgr.prepend_keymap]]
on = ["c", "p"]
run = "plugin convert -- --extension='png'"
desc = "Convert to png"

[[mgr.prepend_keymap]]
on = ["c", "j"]
run = "plugin convert -- --extension='jpg'"
desc = "Convert to jpg"

[[mgr.prepend_keymap]]
on = ["c", "w"]
run = "plugin convert -- --extension='webp'"
desc = "Convert to webp"
