#:schema https://raw.githubusercontent.com/pamburus/termframe/v0.8.7/schema/json/config.schema.json

mode = "dark"

# Width/height in terminal cells: auto-sized from command output within min/max,
# falling back to `initial` when detection fails.
[terminal]
width = { min = 60, max = 160, step = 4, initial = 100 }
height = { min = 4, max = 60, initial = 24 }

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[theme]
dark = "catppuccin-frappe"
light = "catppuccin-latte"

# Ellograph leads the CSS font stack so locally-rendered SVGs/PNGs match kitty,
# but termframe cannot load it for metrics: local font files hit an unconditional
# URL unwrap (panic at main.rs:300 in v0.8.7), so only URL fonts are listed under
# [[fonts]]. JetBrains Mono supplies cell metrics (0.6em vs Ellograph's 0.615 —
# per-glyph textLength absorbs the difference) and acts as the fallback face.
[font]
family = [
  "Ellograph CF Fixed Pitch",
  "JetBrains Mono",
  "Symbols Nerd Font Mono",
  "monospace",
]
size = 14

# Mirror kitty: Ellograph Thin (100) as normal, Regular (400) as bold.
# Bare integers are required despite the schema saying strings — string weights
# fail to parse at runtime in v0.8.7 (schema bug), hence the noqa directives.
[font.weights]
# tombi: lint.rules.type-mismatch.disabled = true
normal = 100
# tombi: lint.rules.type-mismatch.disabled = true
bold = 400
# tombi: lint.rules.type-mismatch.disabled = true
faint = 100

[padding]
horizontal = 1.4
vertical = 1.1

[window]
enabled = true
shadow = true
style = "catppuccin"

[command]
show = false
prompt = " ❯ "

[syntax.theme]
dark = "catppuccin-frappe"
light = "catppuccin-latte"

[rendering]
line-height = 1.3
bold-is-bright = false
faint-opacity = 0.5

[rendering.svg]
embed-fonts = false
subset-fonts = false
var-palette = false
precision = 3
stroke = 0.025

[[fonts]]
family = "JetBrains Mono"
license = { type = "SIL Open Font License 1.1", link = "https://raw.githubusercontent.com/pamburus/fonts/refs/heads/main/JetBrainsMono/OFL.txt" }
files = [
  "https://raw.githubusercontent.com/pamburus/fonts/refs/heads/main/JetBrainsMono/fonts/variable/JetBrainsMono%5Bwght%5D.woff2",
  "https://raw.githubusercontent.com/pamburus/fonts/refs/heads/main/JetBrainsMono/fonts/variable/JetBrainsMono-Italic%5Bwght%5D.woff2",
]

[[fonts]]
family = "Symbols Nerd Font Mono"
license = { type = "SIL Open Font License 1.1", link = "https://raw.githubusercontent.com/ryanoasis/nerd-fonts/refs/tags/v3.3.0/LICENSE" }
files = [
  "https://raw.githubusercontent.com/pamburus/fonts/refs/heads/main/SymbolsNerdFontMono/nf-s01.woff2",
  "https://raw.githubusercontent.com/pamburus/fonts/refs/heads/main/SymbolsNerdFontMono/nf-s02.woff2",
